version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: identity_broker_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - broker_net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identity_broker_api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=identity_broker
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo
    networks:
      - broker_net

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: identity_broker_ui
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - broker_net

volumes:
  mongo_data:

networks:
  broker_net:
    driver: bridge
